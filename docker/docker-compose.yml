# Lancement : docker compose -f docker/docker-compose.yml up -d --build
# Recherche :  docker compose -f docker/docker-compose.yml run --rm bot python -m quantum_edge research
services:
  bot:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: python -m quantum_edge run
    env_file: ../.env
    environment: [TRADING_MODE=DEMO, QE_ROOT=/data]
    volumes: [qe-data:/data]
    restart: unless-stopped
  dashboard:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: python -m quantum_edge dashboard --host 0.0.0.0 --port 8000
    env_file: ../.env
    environment: [TRADING_MODE=DEMO, QE_ROOT=/data]
    volumes: [qe-data:/data]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
volumes:
  qe-data:
