# Lancement : `docker compose up -d`
# Le conteneur redémarre tout seul en cas de plantage ou de redémarrage du serveur.
# Les agents ne cherchent que quand vous lancez une recherche.
services:
  qg-agents:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - qg-data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  qg-data:
